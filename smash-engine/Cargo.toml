[package]
name = "smash-engine"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Smash execution layer: the approved-technique registry, target adapter and wire canonicalization, controlled transport, fixture orchestration, and the run execution state machine. This is where the wire envelope and third-party dependencies live, keeping smash-core dependency-free."
publish = false

[dependencies]
# smash-core is the dependency-free keystone. The engine is the first crate
# allowed to carry third-party deps, because it is the one that speaks the wire
# envelope (OpenAI-compatible JSON) and computes the argument digest.
smash-core = { path = "../smash-core" }
smash-agent = { path = "../smash-agent" }

# SHA-256 for the argument digest. Standard, widely audited; hand-rolling a hash
# is its own risk, so this dependency is deliberate.
sha2 = "0.10.9"

# serde_json is deliberate, and the reason is byte-identity, not convenience.
# The argument digest the replay contract binds to is sha256(canonical_json(args)),
# and Storm Gate's canonical_json is a serde_json-based "sorted-key compact
# serialization" with specific numeric rules. To match it byte-for-byte we use
# the SAME library the producer uses, rather than hand-rolling an encoder that
# could diverge on number formatting or string escaping — the one place a silent
# one-byte difference would break every vouch match.
#
# `arbitrary_precision` is REQUIRED: Storm Gate's v2 numeric rule keeps integers
# exact at any magnitude (e.g. 123456789012345678901234567890 never collapses to
# a float), which only holds with this feature. It also routes numbers through
# the `$serde_json::private::Number` protocol map, which the strict parse
# boundary below recognizes.
#
# TODO(pin): reconcile the exact serde_json version with Storm Gate's Cargo.lock.
# The magic-map protocol key is wire-stable across 1.0.x and ryu float formatting
# has been stable for years, so any recent 1.0.x should match — but the
# cross-implementation vectors (lifted from Storm Gate's own source) are the
# contract that proves it, and the version should be pinned to theirs once known.
serde_json = { version = "1", features = ["arbitrary_precision"] }

# serde for the strict parse boundary's de traits (canonical) and the derived
# wire-envelope types (adapter).
serde = { version = "1", features = ["derive"] }

# ureq is the blocking HTTP client behind the live Sender. Chosen deliberately:
# it matches the serial MVP (no async runtime), is a small dependency tree, uses
# rustls (no system OpenSSL), and honors system/proxy TLS by default. The Sender
# trait isolates it, so swapping to an async client later touches only one impl.
# The live sender disables redirect-following (the transport applies the
# cross-origin rule) and never disables TLS verification.
ureq = "2.12"

# Standards-based URL parsing for the M3 target policy. This was already in the
# lockfile through ureq; declaring it directly prevents hand-rolled authority
# parsing from disagreeing with the HTTP client about origins and userinfo.
url = "2.5"

# Deadline-aware process waiting for the fixed repository Git inspection command.
# The adapter never invokes a shell or accepts arbitrary model-provided arguments.
wait-timeout = "0.2"

# Safe directory-descriptor traversal, no-follow file opening, process groups,
# and no-replace publication for the repository reconnaissance adapter.
rustix = { version = "0.38", features = ["fs", "process", "rand"] }

[lints]
# unsafe_code = "deny" applies to this crate's own code, except for the Linux
# runner's documented child-local pre_exec fcntl. Third-party deps are reviewed
# on their own terms, per the spec: the lint does not remove transitive risk,
# and we do not claim it does.
workspace = true
