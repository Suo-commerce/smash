[package]
name = "smash-findings"
version = "0.1.0"
edition = "2021"
description = "The candidate/finding lifecycle ledger — the control plane that keeps candidate≠finding honest at volume. Step 1: record schema, canonical-key dedup, lifecycle graph, append-only ledger. (specs/findings-management.md)"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[features]
# ingest (default): project real Candidate / RunBundle artifacts into records; the
# only part of the crate that depends on the rest of the workspace. Build the crate
# with `--no-default-features` for the pure-data core alone (record/lifecycle/ledger).
default = ["ingest"]
ingest = ["dep:smash-generator", "dep:smash-loop", "dep:smash-engine"]

[dependencies]
# The data core (record/lifecycle/ledger) keys off the candidate's canonical-key
# *string* and serde-native fields, so it carries no smash-* dependency. The ingest
# module adds the workspace deps below, behind the `ingest` feature.
#
# Loose, workspace-compatible requirements; the active resolution is locked in
# Cargo.lock. The excluded Stormgate target pack has a separate dependency graph.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ingest-only: smash-core comes in transitively via these.
smash-generator = { path = "../smash-generator", optional = true }
smash-loop = { path = "../smash-loop", optional = true }
smash-engine = { path = "../smash-engine", optional = true }

[dev-dependencies]
