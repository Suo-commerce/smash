# smash-capstone — concrete differential-discovery wiring + the L0 capstone.
#
# The safety kernel (`smash-loop`) defines the ports as abstractions; this crate holds
# the concrete port impls that drive the model-free generator's metamorphic pairs through
# an in-process gate differential (the `harness` module), and the end-to-end capstone that
# wires generator → loop → engine bundle → findings ledger. It is an application/harness
# crate, not part of the kernel — so the kernel stays free of target-flavoured impls.
[package]
name = "smash-capstone"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
smash-core = { path = "../smash-core" }
smash-engine = { path = "../smash-engine" }
smash-generator = { path = "../smash-generator" }
smash-loop = { path = "../smash-loop" }

[dev-dependencies]
smash-agent = { path = "../smash-agent" }
smash-cli = { path = "../smash-cli" }
# The capstone integration test ingests + clusters; `ingest` is smash-findings' default
# feature but we name it explicitly so the dependency is unambiguous.
smash-findings = { path = "../smash-findings", features = ["ingest"] }
serde_json = "1"
sha2 = "0.10"
